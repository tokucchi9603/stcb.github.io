<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ストッパーキューブリッジ</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#1d1433;color:#eee;font-family:system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px}h1{font-size:22px;color:#e1ff64}h2{font-size:16px;margin-top:28px;color:#ffaf4b}
button,select,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #555;background:#2b1f4a;color:#fff}
button{cursor:pointer;background:#5a3fa0;border:0}button.big{padding:14px 22px;font-size:17px;margin:4px 6px 4px 0}
table{border-collapse:collapse;width:100%}td,th{padding:3px;text-align:center;font-size:13px}td input{width:64px;padding:5px}
.code{font-size:42px;letter-spacing:.15em;color:#e1ff64;font-weight:700}small,li{color:#bbb;line-height:1.6}
body.play{background:#000;overflow:hidden}canvas{display:block;margin:auto}
#ov{position:fixed;left:8px;top:8px;background:#000c;padding:8px 12px;border-radius:8px;display:none}
body.pad{touch-action:none;user-select:none;-webkit-user-select:none;text-align:center}
#hold{width:86vw;max-width:420px;height:42vh;margin:12px auto;border-radius:28px;font-size:30px;font-weight:700;background:#e1ff64;color:#3c2864;display:flex;align-items:center;justify-content:center}
#hold.on{background:#ffaf4b;transform:scale(.97)}.tabs button{background:#2b1f4a}.tabs button.sel{background:#5a3fa0}
</style></head><body>
<script>
const nowE=()=>performance.timeOrigin+performance.now();
const DEF=[[10,1,5,'b'],[9,1,5,'b'],[8,1,7,'d'],[7,1,9,'u'],[6,1,9,'d'],[5,4,11,'b'],[4,1,11,'b'],[12,2,60,'d'],[2,3,11,'b'],[1,1,14,'b']];
const loadCfg=()=>{try{return JSON.parse(localStorage.scb2)||DEF}catch(e){return DEF}};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('scbwav',1);r.onupgradeneeded=()=>r.result.createObjectStore('w');r.onsuccess=()=>res(r.result);r.onerror=rej});
const idbGet=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('w').objectStore('w').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}};
const idbSet=async(k,v)=>{const d=await idb();return new Promise(r=>{const t=d.transaction('w','readwrite');v?t.objectStore('w').put(v,k):t.objectStore('w').delete(k);t.oncomplete=()=>r()})};
const NAMES=['appear','step','stop','drop','over','bgm','clear'];
const view=location.hash.slice(1)||'home';
let bc;try{bc=new BroadcastChannel('scb')}catch(e){bc={postMessage(){}}}
({home,play,pad})[view]?.();

/* ---------- ランチャー & エディット ---------- */
function home(){
 let cfg=loadCfg().map(r=>[...r]);
 document.body.innerHTML=`<main><h1>ストッパーキューブリッジ</h1>
 <button class=big id=bp>▶ プレイ画面を開く</button><button class=big id=bs>📱 ストップボタン画面を開く</button>
 <h2>スマホ接続コード</h2><div class=code id=cd>------</div>
 <small>プレイ画面を開くと表示されます。スマホでこのページを開き「ストップボタン画面」→コード6桁を入力。同じPC内ならコード不要です。</small>
 <h2>ブロックエディット</h2><table id=tb></table>
 <p><button id=ad>＋行を追加</button> <button id=rs>初期値に戻す</button> <span id=sm></span></p>
 <small>高さ=縦マス数 / 幅=横マス数（幅の合計が16列になるとクリア）/ 速さ=マス毎秒 / 方向=往復・↓のみ・↑のみ。変更は次のゲーム開始時に反映されます。</small>
 <h2>サウンド（wavファイルを設定）</h2><div id=sn></div><small>未設定の項目は簡易的な電子音で代用します（ゲームBGMのみ簡易ループ音）。設定はこのブラウザに保存されます。</small>
 <h2>操作</h2><ul><li>音を鳴らすため、プレイ画面を最初に一度クリックしてください</li><li>プレイ画面：クリック/Spaceで開始、Fで全画面、Cで接続コード表示</li><li>ゲーム終了後もストップボタンを押すと再スタート</li></ul></main>`;
 const $=s=>document.querySelector(s);
 const save=()=>{localStorage.scb2=JSON.stringify(cfg);const w=cfg.reduce((a,r)=>a+r[1],0);$('#sm').textContent=`幅の合計：${w}/16`+(w<16?'（足りない分はクリア扱い）':'')};
 const draw=()=>{$('#tb').innerHTML='<tr><th>#<th>高さ<th>幅<th>速さ<th>方向<th></tr>'+cfg.map((r,i)=>`<tr><td>${i+1}<td><input type=number min=1 max=12 value=${r[0]} data-i=${i} data-j=0><td><input type=number min=1 max=16 value=${r[1]} data-i=${i} data-j=1><td><input type=number min=1 max=200 step=0.5 value=${r[2]} data-i=${i} data-j=2><td><select data-i=${i} data-j=3>${[['b','往復'],['d','↓のみ'],['u','↑のみ']].map(o=>`<option value=${o[0]} ${r[3]==o[0]?'selected':''}>${o[1]}`).join('')}</select><td><button data-x=${i}>✕</button></tr>`).join('');save()};
 $('#tb').onchange=e=>{const t=e.target,i=+t.dataset.i,j=+t.dataset.j;cfg[i][j]=j==3?t.value:+t.value;save()};
 $('#tb').onclick=e=>{if(e.target.dataset.x!=null){cfg.splice(+e.target.dataset.x,1);draw()}};
 $('#ad').onclick=()=>{cfg.push([3,1,8,'b']);draw()};$('#rs').onclick=()=>{cfg=DEF.map(r=>[...r]);draw()};
 $('#bp').onclick=()=>window.open('#play','scbplay');$('#bs').onclick=()=>window.open('#pad','scbpad');
 bc.onmessage=e=>{if(e.data.k=='code')$('#cd').textContent=e.data.v};bc.postMessage({k:'ask'});draw();
 const SL=[['appear','列出現音（ピッ）'],['step','移動音（速度で高く）'],['stop','停止音'],['drop','落下音'],['over','ゲームオーバーBGM'],['bgm','ゲームBGM（ループ）'],['clear','クリアBGM']];
 const drawSn=async()=>{let h='';for(const[k,l]of SL){const v=await idbGet(k);h+=`<p>${l}：<input type=file accept="audio/wav,audio/*" data-k=${k}> <small>${v?v.n:'未設定（簡易音）'}</small> ${v?`<button data-d=${k}>削除</button>`:''}</p>`}$('#sn').innerHTML=h};
 $('#sn').onchange=async e=>{const f=e.target.files[0];if(!f)return;await idbSet(e.target.dataset.k,{n:f.name,d:await f.arrayBuffer()});bc.postMessage({k:'wav'});drawSn()};
 $('#sn').onclick=async e=>{if(e.target.dataset.d){await idbSet(e.target.dataset.d,null);bc.postMessage({k:'wav'});drawSn()}};drawSn();
}

/* ---------- プレイ画面 ---------- */
function play(){
 document.body.className='play';
 document.body.innerHTML='<canvas id=cv></canvas><div id=ov></div>';
 const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
 const S=56,B=4,COL='#e1ff64',ON='#ffaf4b',BG='#3c2864',R=12,C=16;
 const grid=n=>{const a=[];let x=B;for(let i=0;i<n;i++){a.push(x);x+=S+(i<n-1?(i+1)%2?2:4:B)}return[a,x]};
 const[X,W]=grid(C),[Y,H]=grid(R);
 const fit=()=>{const d=devicePixelRatio||1,k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px';cv.width=W*k*d;cv.height=H*k*d;ctx.setTransform(k*d,0,0,k*d,0,0)};
 addEventListener('resize',fit);fit();
 // ブロック先頭行の位置（時間の関数なので、受信遅延ぶん過去に巻き戻して判定できる）
 const pos=(st,t)=>{const[h,,v,d]=st,L=R+h,P=L+1,s=Math.max(0,t/1000)*v;
  if(d=='d')return -h+s%P;if(d=='u')return R-s%P;const m=s%(2*P);return -h+Math.min(L,m<P?m:2*P-m)};
 const AC=new(window.AudioContext||window.webkitAudioContext)(),buf={};
 const wake=()=>{if(AC.state!='running')AC.resume()};['mousedown','keydown','touchstart'].forEach(t=>addEventListener(t,wake));
 const loadSnd=async()=>{for(const k of NAMES){const v=await idbGet(k);delete buf[k];if(v)try{buf[k]=await AC.decodeAudioData(v.d.slice(0))}catch(e){}}};loadSnd();
 function tone(f,d,type='square',g=.15,f2){const t=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(t+d)}
 function snd(k,rate=1,loop=false){if(buf[k]){const s=AC.createBufferSource();s.buffer=buf[k];s.playbackRate.value=rate;s.loop=loop;s.connect(AC.destination);s.start();return s}
  const q={appear:()=>tone(1400,.09),step:()=>tone(500*rate,.03,'square',.08),stop:()=>tone(260,.12,'sawtooth',.2),drop:()=>tone(500,.35,'triangle',.2,80),
   over:()=>[400,330,260,180].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.15),i*220)),clear:()=>[523,659,784,1046,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.12),i*180))};q[k]?.()}
 const bgm={s:null,t:null,on:false,play(){if(this.on)return;this.on=true;if(buf.bgm)this.s=snd('bgm',1,true);else{let i=0;const n=[262,330,392,523,392,330];this.t=setInterval(()=>tone(n[i++%6],.12,'triangle',.07),170)}},
  stop(){this.on=false;try{this.s&&this.s.stop()}catch(e){}this.s=null;clearInterval(this.t)}};
 function appear(){snd('appear');const st=G.cfg[G.stage];if(st&&(st[2]>=40||G.stage==G.cfg.length-1))bgm.stop()}
 function begin(n){G.t0=n;G.lp=null;G.ls=0;appear()}
 const G={s:'idle',stage:0,col:0,placed:[],prev:[0,R],cfg:[],t0:0,tS:0,last:null,fail:null,shards:null,tEnd:0};
 const seen=new Set();
 function start(n){G.cfg=loadCfg();G.stage=0;G.col=0;G.placed=[];G.prev=[0,R];G.last=null;G.fail=null;G.shards=null;G.s='move';G.cut=false;bgm.stop();bgm.play();begin(n)}
 function onStop(t){const n=nowE();
  if(G.s!='move'){if(['idle','over','clear'].includes(G.s)&&n-G.tEnd>1500&&!(G.s=='over'&&n-G.tS<5000))start(n);return}
  const tp=Math.max(G.t0,n-400,Math.min(t,n)),st=G.cfg[G.stage],h=st[0];
  const p=Math.floor(pos(st,tp-G.t0)),va=Math.max(p,0),vb=Math.min(p+h,R);
  const a=Math.max(va,G.prev[0]),b=Math.min(vb,G.prev[1]);
  G.last={c:G.col,w:st[1],va,vb,a,b,p,h};G.tS=n;snd('stop');
  if(b<=a){G.s='over';G.tEnd=n;G.os=false;bgm.stop();G.fail={c:G.col,w:st[1],a:va,b:vb};return}
  const pc=G.stage==0?h:G.prev[1]-G.prev[0],th=G.stage==0?.31:.51;
  G.placed.push({c:G.col,w:st[1],a,b});G.prev=[a,b];G.col+=st[1];G.stage++;G.s='stop';G.dropped=false;
  if((pc-(b-a))/pc>=th){bgm.stop();G.cut=true}
  else{G.cut=false;if(G.stage<G.cfg.length-1&&G.col<C&&!bgm.on)bgm.play()}}
 function msg(d,reply){if(d.k=='p')reply({k:'q',a:d.a,b:nowE()});
  else if(d.k=='stop'&&!seen.has(d.id||d.t)){seen.add(d.id||d.t);onStop(d.t)}}
 bc.onmessage=e=>{if(e.data.k=='ask')ann();else if(e.data.k=='wav')loadSnd();else msg(e.data,m=>bc.postMessage(m))};
 let code='';const ann=()=>code&&bc.postMessage({k:'code',v:code});setInterval(ann,2000);
 function net(){if(typeof Peer=='undefined')return;const c=String(Math.floor(Math.random()*1e6)).padStart(6,'0');const p=new Peer('scb-'+c);
  p.on('open',()=>{code=c;ov.textContent='接続コード：'+c;ann()});p.on('error',e=>{if(e.type=='unavailable-id')net()});
  p.on('connection',cn=>cn.on('data',d=>msg(d,m=>cn.send(m))))}
 net();
 addEventListener('keydown',e=>{if(e.key=='f'||e.key=='F')document.documentElement.requestFullscreen?.();
  else if(e.key=='c'||e.key=='C')ov.style.display=ov.style.display=='block'?'none':'block';
  else if(e.key==' '||e.key=='Enter'){e.preventDefault();onStop(nowE())}});
 addEventListener('mousedown',()=>{if(G.s=='idle')start(nowE())});
 const cell=(c,r,col,al=1,dy=0)=>{ctx.globalAlpha=al;ctx.fillStyle=col;ctx.fillRect(X[c],Y[r]+dy,S,S)};
 const rows=(o,col,al,dy)=>{for(let c=o.c;c<o.c+o.w&&c<C;c++)for(let r=o.a;r<o.b;r++)cell(c,r,col,al,dy||0)};
 const halo=o=>{ctx.globalAlpha=1;ctx.fillStyle='#000';for(let c=o.c;c<o.c+o.w;c++)for(let r=o.a;r<o.b;r++)ctx.fillRect(X[c]-3,Y[r]-3,S+6,S+6)};
 function normalBg(){ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.fillStyle=BG;for(let c=0;c<C;c++)for(let r=0;r<R;r++)ctx.fillRect(X[c],Y[r],S,S)}
 function ripple(t){ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let c=0;c<C;c++)for(let r=0;r<R;r++){const d=Math.hypot(c-7.5,r-5.5),ph=(((d-t*7)/5)%1+1)%1;
   const lv=(d<t*7+1&&ph<.5?Math.ceil((1-ph*2)*3)/3:0)*.2;
   ctx.fillStyle=`rgb(${60+Math.round(195*lv)},${40+Math.round(90*lv)},${100+Math.round(30*lv)})`;ctx.fillRect(X[c],Y[r],S,S)}}
 function frame(){
  const n=nowE();
  if(G.s=='stop'){const last=G.stage>=G.cfg.length||G.col>=C;
   if(n-G.tS>=(last?1500:4500)){if(last){G.s='clear';G.tS=n;G.tEnd=n;bgm.stop();snd('clear')}else{G.s='move';begin(n)}}}
  const ot=(n-G.tS)/1000,rip=G.s=='over'&&ot>1.5;
  if(rip)ripple(ot-1.5);else normalBg();
  if(G.s=='move'){const st=G.cfg[G.stage],p=Math.floor(pos(st,n-G.t0));
   const si=Math.floor((n-G.t0)/1000*st[2]);if(si!==G.lp){G.lp=si;if(n-G.ls>35){G.ls=n;snd('step',Math.min(3,Math.max(.8,1+Math.log2(st[2]/4)*.5)))}}
   G.placed.forEach(o=>rows(o,ON));rows({c:G.col,w:st[1],a:Math.max(p,0),b:Math.min(p+st[0],R)},COL)}
  else if(G.s=='stop'){const bl=ot<1.5&&Math.floor(ot/.15)%2==1,L=G.last;
   if(ot>.5&&!G.dropped&&(L.a>L.p||L.p+L.h>L.b)){G.dropped=true;snd('drop')}
   const k=ot>.5?Math.ceil(.5*45*(ot-.5)**2):0,fall=(a,b)=>{for(let c=L.c;c<L.c+L.w&&c<C;c++)for(let r=a;r<b;r++){const y=r+k;if(y>=0&&y<R)cell(c,y,COL)}};
   fall(L.p,L.a);fall(L.b,L.p+L.h);
   G.placed.forEach((o,i)=>rows(o,i==G.placed.length-1&&bl?COL:ON))}
  else if(G.s=='clear'){const t=ot*220;G.placed.forEach(o=>{for(let c=o.c;c<o.c+o.w;c++)for(let r=o.a;r<o.b;r++)cell(c,r,`hsl(${((c*24-t)%360+360)%360},100%,60%)`)})}
  else if(G.s=='over'){
   if(ot>=1.5&&!G.os){G.os=true;snd('over')}
   if(ot<1.5){G.placed.forEach(o=>rows(o,ON));rows(G.fail,COL)}
   else if(ot<4){if(!G.shards){G.shards=[];[...G.placed,G.fail].forEach(o=>{for(let c=o.c;c<o.c+o.w;c++)for(let r=o.a;r<o.b;r++)G.shards.push({c,r,vx:(Math.random()-.5)*12,vy:-Math.random()*9})})}
    const t=ot-1.5;G.shards.forEach(q=>{const x=Math.round(q.c+q.vx*t),y=Math.round(q.r+q.vy*t+18*t*t);if(x>=0&&x<C&&y>=0&&y<R)cell(x,y,ON)})}
   else{const f=Math.min(1,ot-4);G.placed.forEach(o=>rows(o,ON,f));rows(G.fail,COL,f)}}
  ctx.globalAlpha=1;requestAnimationFrame(frame)}
 frame();
}

/* ---------- ストップボタン画面（PCボタン / スマホ振り） ---------- */
function pad(){
 document.body.className='pad';
 document.body.innerHTML=`<main><div class=tabs><button id=m1 class=sel>ボタンで止める</button> <button id=m2>スマホを振って止める</button></div>
 <p><input id=cd inputmode=numeric maxlength=6 placeholder="接続コード6桁" size=10> <button id=cn>接続</button><br><small id=st>未接続（同じPC内ならコード不要）</small></p>
 <div id=sh style="display:none"><button id=pm class=big>センサーを許可</button><br>
 <small>押すと「動きと方向へのアクセス」の許可を求められます。<b>許可</b>してください（iPhoneは設定→Safari→「動きと方向へのアクセス」もON）。<br>※HTTPS配信のページでのみ動作します。</small><br>
 <small>感度：<input type=range id=th min=4 max=40 value=14 style="padding:0"> <span id=tv>14</span>　現在の強さ：<b id=mt>0</b></small></div>
 <div id=hold>STOP</div><small id=hint>タップ／Spaceキーで止める</small></main>`;
 const $=s=>document.querySelector(s);
 let conn=null,off=0,smp=[],mode=1,armed=false,th=14;
 // 停止イベントは「押した瞬間の時刻」を付けて3回送信（非順序・非再送のDataChannelで低遅延、欠落対策）
 const fire=()=>{const m={k:'stop',id:Math.random().toString(36).slice(2),t:nowE()+off};
  if(conn&&conn.open){conn.send(m);setTimeout(()=>conn.send(m),7);setTimeout(()=>conn.send(m),16)}else bc.postMessage({...m,t:nowE()});
  navigator.vibrate?.(25)};
 $('#cn').onclick=()=>{const c=$('#cd').value.trim();if(c.length<6||typeof Peer=='undefined'){$('#st').textContent='6桁のコードを入力してください（またはネット接続を確認）';return}
  $('#st').textContent='接続中…';const p=new Peer();
  p.on('open',()=>{conn=p.connect('scb-'+c,{reliable:false,serialization:'json'});
   conn.on('open',()=>{const ping=()=>{conn.open&&conn.send({k:'p',a:nowE()})};ping();setInterval(ping,300)});
   conn.on('data',d=>{if(d.k!='q')return;const t=nowE();smp.push([t-d.a,d.b-(d.a+t)/2]);if(smp.length>12)smp.shift();
    const b=smp.reduce((x,y)=>y[0]<x[0]?y:x);off=b[1];$('#st').textContent=`接続OK ✔ 往復遅延 ${b[0].toFixed(0)}ms（補正済み）`})});
  p.on('error',e=>$('#st').textContent='接続エラー：'+e.type)};
 const setMode=m=>{mode=m;$('#m1').className=m==1?'sel':'';$('#m2').className=m==2?'sel':'';$('#sh').style.display=m==2?'block':'none';
  $('#hold').textContent=m==1?'STOP':'押しながら振る';$('#hint').textContent=m==1?'タップ／Spaceキーで止める':'ボタンを押している間だけ、振ると止まります（試し振りOK）'};
 $('#m1').onclick=()=>setMode(1);$('#m2').onclick=()=>setMode(2);
 const h=$('#hold');
 h.addEventListener('pointerdown',e=>{e.preventDefault();h.classList.add('on');if(mode==1)fire();else armed=true});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>h.addEventListener(t,()=>{h.classList.remove('on');armed=false}));
 addEventListener('keydown',e=>{if(e.key==' '&&!e.repeat&&mode==1&&document.activeElement.tagName!='INPUT'){e.preventDefault();fire()}});
 addEventListener('contextmenu',e=>e.preventDefault());
 $('#th').oninput=e=>{th=+e.target.value;$('#tv').textContent=th};
 const onMotion=e=>{const a=e.acceleration;let m;
  if(a&&a.x!=null)m=Math.hypot(a.x,a.y,a.z);else{const g=e.accelerationIncludingGravity;if(!g)return;m=Math.abs(Math.hypot(g.x,g.y,g.z)-9.8)}
  $('#mt').textContent=m.toFixed(0);if(armed&&m>th){armed=false;fire()}};
 $('#pm').onclick=async()=>{try{if(typeof DeviceMotionEvent!='undefined'&&DeviceMotionEvent.requestPermission){const r=await DeviceMotionEvent.requestPermission();if(r!='granted'){$('#pm').textContent='許可されませんでした（設定を確認）';return}}
  addEventListener('devicemotion',onMotion);$('#pm').textContent='センサー有効 ✔';navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){$('#pm').textContent='エラー：'+e.message}};
 if(!isSecureContext)$('#st').textContent='⚠ HTTPSでないためセンサーが使えません';
}
</script></body></html>
